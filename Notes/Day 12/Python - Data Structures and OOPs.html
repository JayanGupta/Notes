<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Advanced: Data Structures & OOP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Fira+Code:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .font-code {
            font-family: 'Fira Code', monospace;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .code-line {
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .code-line.active {
            background: rgba(59, 130, 246, 0.2);
            border-left: 3px solid #60a5fa;
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Specific Viz Animations */
        .node-enter {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .arrow-flow {
            stroke-dasharray: 10;
            animation: flow 1s linear infinite;
        }

        @keyframes flow {
            to {
                stroke-dashoffset: -20;
            }
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- SHARED COMPONENTS ---

        const CodeBlock = ({ code, activeLine }) => (
            <div className="bg-slate-950 rounded-lg p-4 font-code text-xs md:text-sm border border-slate-700 shadow-inner overflow-hidden overflow-x-auto h-full">
                {code.split('\n').map((line, i) => (
                    <div key={i} className={`code-line px-2 py-1 flex ${activeLine === i ? 'active' : ''}`}>
                        <span className="text-slate-600 w-6 select-none text-right mr-4">{i + 1}</span>
                        <span className="text-slate-200 whitespace-pre">{line}</span>
                    </div>
                ))}
            </div>
        );

        // --- VISUALIZATION ENGINES ---

        // 1. DATA STRUCTURE EXPLORER (List, Tuple, Set, Dict)
        const DSViz = ({ type }) => {
            const [items, setItems] = useState(
                type === 'dict' ? { name: 'Alice', age: 25 } : [10, 20, 30]
            );

            const addItem = () => {
                if (type === 'list') setItems([...items, items[items.length - 1] + 10]);
                if (type === 'tuple') return; // Immutable
                if (type === 'set') {
                    const newItem = Math.floor(Math.random() * 50);
                    if (!items.includes(newItem)) setItems([...items, newItem]);
                }
                if (type === 'dict') setItems({ ...items, score: 99 });
            };

            const renderViz = () => {
                if (type === 'dict') {
                    return (
                        <div className="flex flex-col gap-2">
                            {Object.entries(items).map(([k, v]) => (
                                <div key={k} className="flex items-center gap-2 node-enter">
                                    <div className="bg-slate-800 px-2 py-1 rounded border border-purple-500/50 text-purple-300 text-xs font-mono">{k}</div>
                                    <div className="text-slate-500">➜</div>
                                    <div className="bg-slate-800 px-3 py-2 rounded border border-blue-500/50 text-blue-300 font-bold">{v}</div>
                                </div>
                            ))}
                        </div>
                    );
                }

                return (
                    <div className={`flex flex-wrap gap-2 ${type === 'set' ? 'justify-center p-4 rounded-full border-2 border-dashed border-slate-700' : ''}`}>
                        {items.map((val, i) => (
                            <div key={i} className={`
                            w-12 h-12 flex items-center justify-center rounded-lg font-bold shadow-lg node-enter transition-all
                            ${type === 'list' ? 'bg-blue-900/40 border border-blue-500 text-blue-200' : ''}
                            ${type === 'tuple' ? 'bg-slate-700 border border-slate-500 text-slate-400 opacity-90' : ''}
                            ${type === 'set' ? 'bg-green-900/40 border border-green-500 text-green-200 rounded-full' : ''}
                        `}>
                                {val}
                            </div>
                        ))}
                        {type === 'tuple' && <div className="absolute inset-0 border-2 border-red-500/30 rounded-lg pointer-events-none flex items-center justify-center"><span className="bg-slate-900 text-red-400 text-xs px-2">IMMUTABLE</span></div>}
                    </div>
                );
            };

            return (
                <div className="flex flex-col items-center justify-center h-full gap-6">
                    <div className="relative p-6 bg-slate-900/50 rounded-xl border border-slate-700 min-w-[300px] min-h-[150px] flex items-center justify-center">
                        {renderViz()}
                    </div>
                    <button
                        onClick={addItem}
                        disabled={type === 'tuple'}
                        className={`px-4 py-2 rounded font-mono text-xs transition-all ${type === 'tuple'
                            ? 'bg-slate-800 text-slate-500 cursor-not-allowed'
                            : 'bg-blue-600 hover:bg-blue-500 text-white shadow-lg'
                            }`}
                    >
                        {type === 'dict' ? 'items["score"] = 99' : type === 'set' ? 'set.add(random)' : type === 'list' ? 'list.append(n)' : 'Cannot change tuple'}
                    </button>
                </div>
            );
        };

        // 2. LIST COMPREHENSION VIZ
        const ListCompViz = () => {
            const input = [1, 2, 3, 4];

            return (
                <div className="flex flex-col items-center justify-center h-full gap-4">
                    <div className="font-code text-sm bg-slate-900 p-3 rounded border border-slate-700">
                        [ <span className="text-blue-400">x * 2</span> for <span className="text-green-400">x</span> in <span className="text-purple-400">nums</span> ]
                    </div>

                    <div className="flex items-center gap-4 w-full justify-center">
                        {/* Input List */}
                        <div className="flex flex-col gap-2 p-2 border border-dashed border-purple-500/30 rounded">
                            <div className="text-xs text-center text-purple-400">nums</div>
                            {input.map(n => (
                                <div key={n} className="w-10 h-10 bg-slate-800 flex items-center justify-center border border-slate-600 rounded text-slate-400">{n}</div>
                            ))}
                        </div>

                        {/* Logic Arrow */}
                        <div className="flex flex-col items-center gap-1">
                            <div className="text-xs text-blue-400 font-mono">x * 2</div>
                            <div className="h-40 w-0.5 bg-slate-700 relative">
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-slate-900 p-1 rounded-full border border-blue-500 text-blue-400">⚙️</div>
                            </div>
                        </div>

                        {/* Output List */}
                        <div className="flex flex-col gap-2 p-2 border border-dashed border-green-500/30 rounded">
                            <div className="text-xs text-center text-green-400">result</div>
                            {input.map(n => (
                                <div key={n} className="w-10 h-10 bg-blue-900/20 flex items-center justify-center border border-blue-500 rounded text-blue-300 font-bold node-enter" style={{ animationDelay: `${n * 0.1}s` }}>
                                    {n * 2}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // 3. OOP HIERARCHY VIZ (Inheritance & Polymorphism)
        const OOPViz = ({ mode }) => {
            const [activeMethod, setActiveMethod] = useState(null);

            const activate = (method) => {
                setActiveMethod(method);
                setTimeout(() => setActiveMethod(null), 1500);
            };

            return (
                <div className="flex flex-col h-full items-center justify-center">
                    {/* Parent */}
                    <div className="flex flex-col items-center mb-8">
                        <div className="bg-slate-800 border-2 border-purple-500 p-4 rounded-xl text-center relative shadow-[0_0_20px_rgba(168,85,247,0.2)]">
                            <div className="text-xs text-purple-400 font-bold uppercase tracking-wider mb-1">Parent Class</div>
                            <div className="text-xl font-bold text-white">Animal</div>
                            <div className="mt-2 pt-2 border-t border-slate-700 text-xs font-mono text-slate-400">
                                def speak(): print("???")
                            </div>
                        </div>
                        <div className="h-8 w-0.5 bg-slate-600"></div>
                        <div className="w-32 h-0.5 bg-slate-600"></div> {/* Horizontal branch */}
                        <div className="flex justify-between w-32">
                            <div className="h-4 w-0.5 bg-slate-600"></div>
                            <div className="h-4 w-0.5 bg-slate-600"></div>
                        </div>
                    </div>

                    {/* Children */}
                    <div className="flex gap-12">
                        {/* Dog */}
                        <div className="flex flex-col items-center">
                            <div className={`bg-slate-800 border-2 border-blue-500 p-3 rounded-xl text-center transition-all duration-300 ${activeMethod === 'dog' ? 'scale-110 shadow-[0_0_20px_rgba(59,130,246,0.5)] bg-blue-900/30' : ''}`}>
                                <div className="text-xs text-blue-400 font-bold mb-1">Child (Inherits)</div>
                                <div className="text-lg font-bold text-white">Dog</div>
                                <div className="mt-2 pt-2 border-t border-slate-700 text-xs font-mono text-slate-400">
                                    speak(): "Woof"
                                </div>
                            </div>
                            <button
                                onClick={() => activate('dog')}
                                className="mt-4 px-3 py-1 bg-slate-700 hover:bg-blue-600 rounded text-xs text-white font-mono transition-colors"
                            >
                                dog.speak()
                            </button>
                            {activeMethod === 'dog' && <div className="mt-2 text-blue-300 font-bold animate-bounce">"Woof!"</div>}
                        </div>

                        {/* Cat */}
                        <div className="flex flex-col items-center">
                            <div className={`bg-slate-800 border-2 border-pink-500 p-3 rounded-xl text-center transition-all duration-300 ${activeMethod === 'cat' ? 'scale-110 shadow-[0_0_20px_rgba(236,72,153,0.5)] bg-pink-900/30' : ''}`}>
                                <div className="text-xs text-pink-400 font-bold mb-1">Child (Inherits)</div>
                                <div className="text-lg font-bold text-white">Cat</div>
                                <div className="mt-2 pt-2 border-t border-slate-700 text-xs font-mono text-slate-400">
                                    speak(): "Meow"
                                </div>
                            </div>
                            <button
                                onClick={() => activate('cat')}
                                className="mt-4 px-3 py-1 bg-slate-700 hover:bg-pink-600 rounded text-xs text-white font-mono transition-colors"
                            >
                                cat.speak()
                            </button>
                            {activeMethod === 'cat' && <div className="mt-2 text-pink-300 font-bold animate-bounce">"Meow!"</div>}
                        </div>
                    </div>
                </div>
            );
        };

        // 4. LIBRARIES PREVIEW (NumPy, Pandas, Matplotlib)
        const LibraryViz = ({ lib }) => {
            const [filter, setFilter] = useState(50);

            if (lib === 'numpy') {
                return (
                    <div className="flex flex-col items-center justify-center h-full gap-4">
                        <div className="text-xs font-mono text-yellow-400 mb-2">import numpy as np</div>
                        <div className="grid grid-cols-3 gap-2">
                            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => (
                                <div key={n} className="w-12 h-12 bg-slate-800 border border-slate-600 flex items-center justify-center text-slate-300 font-mono text-sm">
                                    {n}
                                </div>
                            ))}
                        </div>
                        <div className="text-xl text-slate-500 font-bold">+</div>
                        <div className="bg-slate-800 px-3 py-1 rounded text-white font-mono">10</div>
                        <div className="text-xl text-slate-500 font-bold">=</div>
                        <div className="grid grid-cols-3 gap-2 p-2 border border-green-500/30 rounded bg-green-900/10">
                            {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => (
                                <div key={n} className="w-12 h-12 bg-green-900/40 border border-green-500 flex items-center justify-center text-green-300 font-bold font-mono text-sm">
                                    {n + 10}
                                </div>
                            ))}
                        </div>
                        <div className="text-xs text-slate-500">Broadcasting Operation</div>
                    </div>
                );
            }

            if (lib === 'pandas') {
                const data = [
                    { id: 1, val: 20 }, { id: 2, val: 80 }, { id: 3, val: 45 }, { id: 4, val: 90 }
                ];
                return (
                    <div className="flex flex-col items-center justify-center h-full">
                        <div className="text-xs font-mono text-blue-400 mb-4">df[df['val'] > {filter}]</div>
                        <input type="range" min="0" max="100" value={filter} onChange={e => setFilter(e.target.value)} className="w-48 mb-6 accent-blue-500" />
                        <div className="w-64 border border-slate-700 rounded overflow-hidden">
                            <div className="flex bg-slate-800 text-xs font-bold p-2 border-b border-slate-700">
                                <div className="w-1/2">ID</div>
                                <div className="w-1/2">Value</div>
                            </div>
                            {data.map(row => (
                                <div key={row.id} className={`flex p-2 text-sm border-b border-slate-800 transition-all ${row.val > filter ? 'bg-blue-900/30 text-blue-200' : 'opacity-30'}`}>
                                    <div className="w-1/2">{row.id}</div>
                                    <div className="w-1/2">{row.val}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }

            if (lib === 'matplotlib') {
                return (
                    <div className="flex flex-col items-center justify-center h-full">
                        <div className="text-xs font-mono text-orange-400 mb-4">plt.bar(x, y)</div>
                        <div className="flex items-end gap-2 h-40 w-64 border-l border-b border-slate-500 p-2">
                            {[40, 70, 30, 90, 60].map((h, i) => (
                                <div key={i} className="flex-1 bg-orange-500 hover:bg-orange-400 transition-all rounded-t relative group" style={{ height: `${h}%` }}>
                                    <div className="absolute -top-6 left-1/2 -translate-x-1/2 text-xs text-white opacity-0 group-hover:opacity-100 transition-opacity">{h}</div>
                                </div>
                            ))}
                        </div>
                    </div>
                );
            }
        };

        // --- MAIN APP ---

        const App = () => {
            const [currentSlide, setCurrentSlide] = useState(0);

            const slides = [
                {
                    title: "Advanced Python",
                    subtitle: "Data Structures & OOP",
                    text: "Moving beyond variables to complex data architecture and object-oriented design patterns.\n\nThis module covers the tools needed for scalable software and data science.",
                    viz: <div className="flex flex-col items-center justify-center h-full gap-4">
                        <div className="text-8xl animate-pulse">🧬</div>
                        <div className="flex gap-4">
                            <span className="px-3 py-1 bg-blue-900/30 border border-blue-500 rounded text-blue-300 text-xs">Structs</span>
                            <span className="px-3 py-1 bg-purple-900/30 border border-purple-500 rounded text-purple-300 text-xs">OOP</span>
                            <span className="px-3 py-1 bg-green-900/30 border border-green-500 rounded text-green-300 text-xs">Libs</span>
                        </div>
                    </div>
                },
                {
                    title: "Data Structures",
                    subtitle: "Why do we need them?",
                    text: "Variables store one thing. Data Structures store **collections** of things.\n\nChoosing the right structure determines your program's speed and efficiency.\n• Need order? Use a List.\n• Need unique items? Use a Set.\n• Need fast lookups? Use a Dictionary.",
                    viz: <div className="grid grid-cols-2 gap-4 p-8 items-center h-full">
                        <div className="bg-slate-800 p-4 rounded text-center border border-slate-700">
                            <div className="text-2xl mb-2">📦</div>
                            <div className="text-sm font-bold">Storage</div>
                        </div>
                        <div className="bg-slate-800 p-4 rounded text-center border border-slate-700">
                            <div className="text-2xl mb-2">⚡</div>
                            <div className="text-sm font-bold">Access Speed</div>
                        </div>
                        <div className="bg-slate-800 p-4 rounded text-center border border-slate-700">
                            <div className="text-2xl mb-2">🔄</div>
                            <div className="text-sm font-bold">Organization</div>
                        </div>
                        <div className="bg-slate-800 p-4 rounded text-center border border-slate-700">
                            <div className="text-2xl mb-2">🔍</div>
                            <div className="text-sm font-bold">Search</div>
                        </div>
                    </div>
                },
                {
                    title: "Strings",
                    subtitle: "Immutable Sequences",
                    text: "Strings are actually ordered sequences of characters. You can access them by index, but you cannot change them in place (Immutable).",
                    viz: <div className="flex flex-col justify-center items-center h-full gap-4">
                        <div className="flex">
                            {['P', 'y', 't', 'h', 'o', 'n'].map((char, i) => (
                                <div key={i} className="flex flex-col items-center group">
                                    <div className="text-[10px] text-slate-500 mb-1 opacity-0 group-hover:opacity-100">{i}</div>
                                    <div className="w-10 h-10 border border-slate-600 flex items-center justify-center bg-slate-800 text-xl font-mono hover:bg-slate-700 hover:border-yellow-500 transition-colors cursor-pointer">
                                        {char}
                                    </div>
                                    <div className="text-[10px] text-slate-500 mt-1 opacity-0 group-hover:opacity-100">-{6 - i}</div>
                                </div>
                            ))}
                        </div>
                        <div className="text-xs text-red-400 font-mono bg-red-900/20 px-2 py-1 rounded">str[0] = 'J' # Error!</div>
                    </div>
                },
                {
                    title: "Lists",
                    subtitle: "Mutable, Ordered Sequences",
                    text: "Lists are the workhorse of Python. They can grow, shrink, and hold mixed data types.\nSyntax: `[1, 2, 3]`",
                    viz: <DSViz type="list" />
                },
                {
                    title: "Tuples",
                    subtitle: "Immutable Sequences",
                    text: "Like Lists, but cannot be changed after creation. Faster and safer for fixed data.\nSyntax: `(1, 2, 3)`",
                    viz: <DSViz type="tuple" />
                },
                {
                    title: "Sets",
                    subtitle: "Unordered, Unique Collection",
                    text: "Sets remove duplicates automatically. Great for math operations like intersection/union.\nSyntax: `{1, 2, 3}`",
                    viz: <DSViz type="set" />
                },
                {
                    title: "Dictionaries",
                    subtitle: "Key-Value Pairs",
                    text: "Maps a unique key to a value. Extremely fast lookups (O(1)).\nSyntax: `{'key': 'value'}`",
                    viz: <DSViz type="dict" />
                },
                {
                    title: "Arrays",
                    subtitle: "Lists vs Arrays",
                    text: "Python Lists are general purpose. Arrays (via NumPy) are specialized for math. Arrays require all elements to be the SAME type, making them much faster.",
                    viz: <div className="flex flex-col gap-4 justify-center h-full px-6">
                        <div className="bg-slate-800 p-3 rounded border border-slate-600">
                            <div className="text-xs text-blue-400 mb-1">Python List</div>
                            <div className="flex gap-1">
                                <div className="w-8 h-8 bg-slate-700 rounded flex items-center justify-center text-xs">1</div>
                                <div className="w-8 h-8 bg-slate-700 rounded flex items-center justify-center text-xs">"A"</div>
                                <div className="w-8 h-8 bg-slate-700 rounded flex items-center justify-center text-xs">3.5</div>
                            </div>
                            <div className="text-[10px] text-slate-500 mt-1">Mixed Types OK</div>
                        </div>
                        <div className="bg-slate-800 p-3 rounded border border-green-600">
                            <div className="text-xs text-green-400 mb-1">NumPy Array</div>
                            <div className="flex gap-0 divide-x divide-slate-600 border border-slate-600">
                                <div className="w-8 h-8 bg-green-900/20 flex items-center justify-center text-xs">1</div>
                                <div className="w-8 h-8 bg-green-900/20 flex items-center justify-center text-xs">2</div>
                                <div className="w-8 h-8 bg-green-900/20 flex items-center justify-center text-xs">3</div>
                            </div>
                            <div className="text-[10px] text-slate-500 mt-1">Single Type Only (Fast)</div>
                        </div>
                    </div>
                },
                {
                    title: "List Comprehension",
                    subtitle: "Syntactic Sugar",
                    text: "A concise way to create lists based on existing lists. It replaces multi-line for-loops with a single line.",
                    viz: <ListCompViz />
                },
                {
                    title: "Python OOP",
                    subtitle: "Object Oriented Programming",
                    text: "A paradigm based on 'objects'. It helps organize code into reusable blueprints (Classes) and usable instances (Objects).",
                    viz: <div className="flex flex-col items-center justify-center h-full gap-4">
                        <div className="border-2 border-dashed border-blue-500 p-4 rounded text-blue-300 text-sm">
                            Class (Blueprint)
                        </div>
                        <div className="text-2xl">⬇️</div>
                        <div className="flex gap-2">
                            <div className="bg-blue-600 p-2 rounded text-white text-xs">Object 1</div>
                            <div className="bg-blue-600 p-2 rounded text-white text-xs">Object 2</div>
                        </div>
                    </div>
                },
                {
                    title: "Classes & Objects",
                    subtitle: "The Blueprint",
                    text: "• Class: The definition (e.g., 'Car').\n• Object: The actual thing (e.g., 'My Red Toyota').\n• Attributes: Data (color, speed).\n• Methods: Functions (drive, stop).",
                    viz: <div className="bg-slate-900 p-4 rounded border border-slate-700 font-code text-xs">
                        <span className="text-purple-400">class</span> Car:<br />
                        &nbsp;&nbsp;<span className="text-purple-400">def</span> __init__(self, color):<br />
                        &nbsp;&nbsp;&nbsp;&nbsp;self.color = color<br /><br />
                        my_car = Car(<span className="text-green-400">"Red"</span>)
                    </div>
                },
                {
                    title: "Inheritance",
                    subtitle: "Parent & Child",
                    text: "Allows a class (Child) to derive attributes and methods from another class (Parent). Promotes code reuse.",
                    viz: <OOPViz mode="inheritance" />
                },
                {
                    title: "Polymorphism",
                    subtitle: "Many Forms",
                    text: "Different classes can be treated as instances of the same general class through a common interface. (e.g., both Cat and Dog have a 'speak' method that acts differently).",
                    viz: <OOPViz mode="poly" />
                },
                {
                    title: "Encapsulation & Abstraction",
                    subtitle: "Hiding Complexity",
                    text: "• Encapsulation: Bundling data and methods, restricting direct access (using `__private` variables).\n• Abstraction: Hiding internal details and showing only functionality.",
                    viz: <div className="flex items-center justify-center h-full">
                        <div className="bg-slate-800 w-32 h-32 rounded-full border-4 border-slate-600 flex items-center justify-center relative overflow-hidden">
                            <div className="absolute inset-0 bg-black/50 flex items-center justify-center z-10">
                                <span className="text-xs font-bold text-white">Public Interface</span>
                            </div>
                            <div className="text-[10px] text-slate-500 absolute bottom-4">Private Data</div>
                            <div className="absolute top-2 right-4 text-red-500">🔒</div>
                        </div>
                    </div>
                },
                {
                    title: "Data Science Libraries",
                    subtitle: "The Ecosystem",
                    text: "Python is #1 for Data Science because of these libraries:\n• NumPy: Math & Matrices\n• Pandas: Data Analysis\n• Matplotlib/Seaborn: Visualization",
                    viz: <div className="grid grid-cols-2 gap-4 w-full p-6">
                        <div className="bg-blue-900/20 border border-blue-500/50 p-3 rounded flex items-center justify-center font-bold text-blue-300">NumPy</div>
                        <div className="bg-purple-900/20 border border-purple-500/50 p-3 rounded flex items-center justify-center font-bold text-purple-300">Pandas</div>
                        <div className="bg-orange-900/20 border border-orange-500/50 p-3 rounded flex items-center justify-center font-bold text-orange-300">Matplotlib</div>
                        <div className="bg-cyan-900/20 border border-cyan-500/50 p-3 rounded flex items-center justify-center font-bold text-cyan-300">Seaborn</div>
                    </div>
                },
                {
                    title: "NumPy",
                    subtitle: "Numerical Python",
                    text: "The foundation. Provides high-performance multidimensional array objects and tools for working with these arrays.",
                    viz: <LibraryViz lib="numpy" />
                },
                {
                    title: "Pandas",
                    subtitle: "Python Data Analysis",
                    text: "Built on NumPy. Offers 'DataFrames' (like Excel sheets in code) for easy data manipulation, cleaning, and analysis.",
                    viz: <LibraryViz lib="pandas" />
                },
                {
                    title: "Matplotlib & Seaborn",
                    subtitle: "Visualization",
                    text: "• Matplotlib: The basic plotting library.\n• Seaborn: Built on top of Matplotlib, makes statistical graphics beautiful by default.",
                    viz: <LibraryViz lib="matplotlib" />
                }
            ];

            useEffect(() => {
                const handleKey = (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') setCurrentSlide(curr => Math.min(curr + 1, slides.length - 1));
                    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') setCurrentSlide(curr => Math.max(curr - 1, 0));
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [slides.length]);

            const CurrentContent = slides[currentSlide];

            return (
                <div className="w-screen h-screen flex flex-col relative bg-slate-950 text-white selection:bg-blue-500/30">
                    {/* Progress Bar */}
                    <div className="w-full h-1 bg-slate-900">
                        <div className="h-full bg-gradient-to-r from-green-400 to-blue-600 transition-all duration-300" style={{ width: `${((currentSlide + 1) / slides.length) * 100}%` }}></div>
                    </div>

                    <div className="flex-1 p-4 md:p-8 flex items-center justify-center overflow-hidden">
                        <div className="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-center h-full lg:h-[80vh]">

                            {/* Left: Text Content */}
                            <div className="flex flex-col justify-center space-y-6 animate-fade-in h-min lg:h-auto">
                                <div>
                                    <div className="text-xs font-mono text-purple-400 mb-2 tracking-widest">ADVANCED MODULE {String(currentSlide + 1).padStart(2, '0')}</div>
                                    <h1 className="text-4xl md:text-5xl font-black text-white mb-2 tracking-tight">
                                        {CurrentContent.title}
                                    </h1>
                                    <h2 className="text-xl md:text-2xl text-slate-400 font-light border-b border-slate-800 pb-4">
                                        {CurrentContent.subtitle}
                                    </h2>
                                </div>
                                <div className="text-base md:text-lg text-slate-300 leading-relaxed whitespace-pre-wrap font-light">
                                    {CurrentContent.text}
                                </div>
                            </div>

                            {/* Right: Visualization Panel */}
                            <div className="h-[400px] lg:h-full max-h-[600px] glass-panel rounded-2xl shadow-2xl overflow-hidden p-1 relative animate-fade-in flex flex-col w-full">
                                <div className="absolute top-0 left-0 w-full h-8 bg-slate-900/80 border-b border-white/5 flex items-center px-4 gap-2 z-10">
                                    <div className="w-2 h-2 rounded-full bg-purple-500/50"></div>
                                    <div className="w-2 h-2 rounded-full bg-blue-500/50"></div>
                                    <span className="ml-auto text-[10px] text-slate-500 font-mono opacity-50">viz_engine_v2.py</span>
                                </div>
                                <div className="mt-8 flex-1 relative overflow-hidden p-2 md:p-4">
                                    {CurrentContent.viz}
                                </div>
                            </div>

                        </div>
                    </div>

                    {/* Footer Controls */}
                    <div className="absolute bottom-6 right-6 flex gap-4 text-slate-500 text-sm font-mono bg-slate-900/90 p-3 rounded-xl border border-slate-800 backdrop-blur z-50 shadow-xl">
                        <button onClick={() => setCurrentSlide(s => Math.max(0, s - 1))} className="hover:text-white hover:bg-white/10 px-3 py-1 rounded transition">PREV</button>
                        <span className="self-center text-slate-300 w-16 text-center">{currentSlide + 1} / {slides.length}</span>
                        <button onClick={() => setCurrentSlide(s => Math.min(slides.length - 1, s + 1))} className="hover:text-white hover:bg-white/10 px-3 py-1 rounded transition">NEXT</button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
