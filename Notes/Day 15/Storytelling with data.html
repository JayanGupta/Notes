    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Core Animations */
        .animate-fade-in { animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-scale-in { animation: scaleIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes scaleIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .draw-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 2.5s ease-out forwards;
        }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        
        .bar-rise { animation: riseUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; transform-origin: bottom; }
        @keyframes riseUp {
            from { transform: scaleY(0); }
            to { transform: scaleY(1); }
        }

        .pop-in { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; transform: scale(0); opacity: 0; }
        @keyframes popIn {
            to { transform: scale(1); opacity: 1; }
        }

        .pulse-glow { animation: pulseGlow 3s infinite alternate; }
        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(251, 191, 36, 0.2); }
            to { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8); }
        }

        /* Pie Chart Reveal */
        .pie-reveal {
            stroke-dasharray: 0 158;
            animation: revealPie 1.5s ease-out forwards;
        }
        @keyframes revealPie {
            to { stroke-dasharray: var(--dash) 158; }
        }
    </style>
</head>
