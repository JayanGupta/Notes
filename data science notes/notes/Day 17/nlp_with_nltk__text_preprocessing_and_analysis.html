<script type="text/babel">
const {useState,useEffect,useRef}=React;

// ====== VISUALIZATION COMPONENTS ======
const Slide1Viz = () => {
    const [isHovered, setIsHovered] = React.useState(false);
    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950 text-slate-300">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 bg-blue-700 text-white text-xs font-bold rounded-full">INTRODUCTION</span>
                    <span className="text-4xl">📚</span>
                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-blue-700 to-indigo-600 bg-clip-text text-transparent">Introduction to NLTK</h1>
                <h2 className="text-xl text-slate-400 mb-6">The Industry Standard for Text Preprocessing</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">

                        <p className="text-lg">In the NLP workflow, NLTK sits firmly in the <strong className="text-indigo-400">Preprocessing stage</strong>, allowing you to clean, normalize, and label text before it reaches a classifier or a neural network.</p>
                    </div>
                    
                    <div className="bg-slate-900/60 border border-slate-700 rounded-2xl p-6 flex flex-col items-center justify-center min-h-[300px]">
                        <svg viewBox="0 0 400 200" className="w-full h-full overflow-visible">

const Slide2Viz = () => {
    const [status, setStatus] = React.useState('idle');
    const [progress, setProgress] = React.useState(0);
    const [logs, setLogs] = React.useState([]);

    const runSetup = () => {
        setStatus('running');
        setLogs([]);
        setProgress(0);
        const packages = ['punkt', 'stopwords', 'wordnet', 'averaged_perceptron_tagger', 'maxent_ne_chunker', 'words'];
        packages.forEach((pkg, i) => {
            setTimeout(() => {
                setLogs(prev => [...prev, `[nltk_data] Downloading package ${pkg}...`]);
                setProgress(((i + 1) / packages.length) * 100);
                if (i === packages.length - 1) setStatus('ready');
            }, (i + 1) * 800);
        });
    };

    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 bg-indigo-700 text-white text-xs font-bold rounded-full">IMPLEMENTATION</span>
                    <span className="text-4xl">⚙️</span>
                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-indigo-700 to-purple-600 bg-clip-text text-transparent">Setup and First NLTK Program</h1>
                <h2 className="text-xl text-slate-400 mb-6">Downloading the "Brains" of the Library</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                        <p className="text-slate-300">NLTK is modular; instead of a massive initial download, you fetch specific <strong>corpora</strong> (datasets) and <strong>models</strong> as needed.</p>
                        <div className="bg-black/40 p-4 rounded-lg border border-slate-700 font-mono text-sm text-blue-300">
                            <p className="text-purple-400">import <span className="text-white">nltk</span></p>
                            <p className="text-slate-500"># Essential downloads</p>
                            <p>nltk.download(<span className="text-amber-400">'punkt'</span>)</p>
                            <p>nltk.download(<span className="text-amber-400">'stopwords'</span>)</p>
                            <p>nltk.download(<span className="text-amber-400">'wordnet'</span>)</p>
                        </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden flex flex-col h-[300px] relative">
                        <div className="bg-slate-800 px-4 py-2 flex items-center gap-2">
                            <div className="w-3 h-3 rounded-full bg-red-500"></div>
                            <div className="w-3 h-3 rounded-full bg-amber-500"></div>
                            <div className="w-3 h-3 rounded-full bg-emerald-500"></div>
                            <span className="text-xs text-slate-400 ml-2 font-mono">terminal — colab</span>
                        </div>
                        <div className="p-4 font-mono text-xs text-emerald-500 flex-1 overflow-y-auto space-y-1">
                            {logs.map((log, i) => <div key={i} className="animate-in fade-in slide-in-from-left-2">{log}</div>)}
                            {status === 'idle' && <div className="text-slate-500">Click "Run Setup" to begin...</div>}
                        </div>
                        <div className="p-4 bg-slate-800/50 border-t border-slate-700">
                            <div className="flex justify-between items-center mb-2">
                                <button 
                                    onClick={runSetup}
                                    disabled={status === 'running'}
                                    className={`px-4 py-2 rounded font-bold text-sm transition-all ${status === 'running' ? 'bg-slate-700 text-slate-500' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}
                                >
                                    {status === 'ready' ? 'Restart Setup' : 'Run Setup'}
                                </button>
                                {status === 'ready' && <span className="text-emerald-400 font-bold text-xs animate-pulse">● READY TO PROCESS</span>}
                            </div>
                            <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                                <div className="bg-indigo-500 h-full transition-all duration-500" style={{width: `${progress}%`}}></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
};

const Slide3Viz = () => {
    const [isSplit, setIsSplit] = React.useState(false);
    const [mousePos, setMousePos] = React.useState({x: 0, y: 0});

    const handleMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        setMousePos({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    };

    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 bg-purple-700 text-white text-xs font-bold rounded-full">INTUITION</span>
                    <span className="text-4xl">✂️</span>
                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-purple-700 to-pink-600 bg-clip-text text-transparent">Sentence Tokenization</h1>
                <h2 className="text-xl text-slate-400 mb-6">Breaking the Continuous Stream</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                        <p className="text-slate-300"><strong>Sentence Tokenization</strong> splits a paragraph into individual sentences. NLTK's <code>sent_tokenize()</code> is smarter than a simple split; it knows "Dr." doesn't end a sentence.</p>
                        <div className="bg-black/40 p-4 rounded-lg border border-slate-700 font-mono text-sm">
                            <p className="text-purple-400">from <span className="text-white">nltk.tokenize</span> import <span className="text-white">sent_tokenize</span></p>
                            <p className="text-blue-300">text = <span className="text-amber-400">"Hello! Dr. Smith is here. He loves NLP."</span></p>
                            <p className="text-blue-300">sentences = sent_tokenize(text)</p>
                        </div>
                    </div>

                    <div 
                        className="bg-slate-900/60 border border-slate-700 rounded-2xl p-6 relative cursor-crosshair overflow-hidden min-h-[300px] flex flex-col justify-center"
                        onMouseMove={handleMouseMove}
                        onClick={() => setIsSplit(!isSplit)}
                    >
                        <div className="relative h-40 flex items-center justify-center">
                            {!isSplit ? (
                                <div className="w-full h-16 bg-gradient-to-r from-purple-600 to-pink-600 rounded-lg flex items-center px-4 text-white font-bold shadow-lg transition-all duration-500">
                                    Hello! Dr. Smith is here. He loves NLP, doesn't he?
                                </div>
                            ) : (
                                <div className="flex flex-col gap-3 w-full">
                                    {["Hello!", "Dr. Smith is here.", "He loves NLP, doesn't he?"].map((s, i) => (
                                        <div key={i} className="h-10 bg-slate-800 border border-purple-500/50 rounded flex items-center px-4 text-purple-300 text-sm font-mono animate-in slide-in-from-top" style={{animationDelay: `${i*100}ms`}}>
                                            {s}
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        
                        {/* Scissors Icon */}
                        <div 
                            className="absolute pointer-events-none text-2xl transition-opacity duration-300"
                            style={{ left: mousePos.x - 12, top: mousePos.y - 12, opacity: isSplit ? 0 : 1 }}
                        >
                            ✂️
                        </div>
                        <p className="text-center text-xs text-slate-500 mt-4">{isSplit ? "Click to Reset" : "Click to Tokenize"}</p>
                    </div>
                </div>
            </div>
        </div>
    );
};

const Slide4Viz = () => {
    const [isTokenized, setIsTokenized] = React.useState(false);
    const tokens = ["NLTK", "is", "powerful", ",", "is", "n't", "it", "?"];

    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 bg-pink-700 text-white text-xs font-bold rounded-full">ALGORITHM</span>
                    <span className="text-4xl">🧩</span>
                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-pink-700 to-rose-600 bg-clip-text text-transparent">Word Tokenization</h1>
                <h2 className="text-xl text-slate-400 mb-6">The Anatomy of a Sentence</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                        <p className="text-slate-300"><strong>Word Tokenization</strong> breaks sentences into discrete units called <strong>tokens</strong>. Machines process lists of strings, not raw blocks of text.</p>
                        <div className="bg-black/40 p-4 rounded-lg border border-slate-700 font-mono text-sm">
                            <p className="text-purple-400">from <span className="text-white">nltk.tokenize</span> import <span className="text-white">word_tokenize</span></p>
                            <p className="text-blue-300">tokens = word_tokenize(<span className="text-amber-400">"NLTK is powerful, isn't it?"</span>)</p>
                            <p className="text-slate-500"># Output: ['NLTK', 'is', 'powerful', ',', 'is', "n't", 'it', '?']</p>

                                <div 
                                    key={i}

                                    style={{transitionDelay: `${i * 50}ms`}}
                                >
                                    {t}
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={() => setIsTokenized(!isTokenized)}
                            className="mt-10 px-6 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-full font-bold transition-colors"

                            {isTokenized ? "Reset" : "Tokenize"}
                        </button>
                    </div>
                </div>
            </div>
        </div>

};

const Slide5Viz = () => {
    const [filters, setFilters] = React.useState({ lower: false, punct: false, stop: false });
    const rawWords = ["The", "Apple", "is", "Running", "!", "and", "Fast", "."];
    
    const getProcessed = () => {
        let words = [...rawWords];
        if (filters.lower) words = words.map(w => w.toLowerCase());
        if (filters.punct) words = words.filter(w => !/[!.]/.test(w));
        if (filters.stop) {
            const stops = ['the', 'is', 'and'];
            words = words.filter(w => !stops.includes(w.toLowerCase()));
        }
        return words;
    };

    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 bg-rose-700 text-white text-xs font-bold rounded-full">VISUALIZATION</span>
                    <span className="text-4xl">🧹</span>
                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-rose-700 to-orange-600 bg-clip-text text-transparent">Text Cleaning & Stopwords</h1>
                <h2 className="text-xl text-slate-400 mb-6">Filtering the Noise with Zipf's Law</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-6">
                        <div className="space-y-4">
                            {Object.entries({lower: "Lowercase", punct: "Remove Punctuation", stop: "Remove Stopwords"}).map(([key, label]) => (
                                <div key={key} className="flex items-center justify-between bg-slate-900/40 p-3 rounded-lg border border-slate-800">
                                    <span className="text-slate-300 font-medium">{label}</span>
                                    <button 
                                        onClick={() => setFilters(f => ({...f, [key]: !f[key]}))}
                                        className={`w-12 h-6 rounded-full transition-colors relative ${filters[key] ? 'bg-orange-500' : 'bg-slate-700'}`}
                                    >
                                        <div className={`absolute top-1 w-4 h-4 bg-white rounded-full transition-all ${filters[key] ? 'left-7' : 'left-1'}`}></div>
                                    </button>
                                </div>
                            ))}
                        </div>
                        <div className="bg-black/40 p-4 rounded-lg border border-slate-700 font-mono text-xs text-orange-300">
                            <p>cleaned = [w.lower() <span className="text-white">for</span> w <span className="text-white">in</span> words]</p>
                            <p><span className="text-white">if</span> w.lower() <span className="text-white">not in</span> stop_words</p>
                        </div>
                    </div>

                    <div className="bg-slate-900/60 border border-slate-700 rounded-2xl p-6 flex flex-col items-center min-h-[300px]">
                        <svg viewBox="0 0 200 200" className="w-full h-48 overflow-visible mb-4">
                            <path d="M 20 20 L 180 20 L 120 150 L 80 150 Z" fill="none" stroke="#475569" strokeWidth="2" strokeDasharray="4 2" />
                            <path d="M 80 150 L 80 190 L 120 190 L 120 150" fill="none" stroke="#475569" strokeWidth="2" />
                            
                            {getProcessed().map((w, i) => (
                                <text 
                                    key={w + i} 
                                    x="100" 
                                    y={40 + (i * 15)} 
                                    textAnchor="middle" 
                                    fill="#fb923c" 
                                    fontSize="10" 
                                    fontWeight="bold"
                                    className="animate-in fade-in zoom-in duration-500"
                                >
                                    {w}
                                </text>
                            ))}
                        </svg>
                        <div className="flex flex-wrap gap-2 justify-center">
                            {getProcessed().map((w, i) => (
                                <span key={i} className="px-2 py-1 bg-orange-900/20 border border-orange-800 text-orange-400 rounded text-xs font-mono">
                                    {w}
                                </span>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
};

const Slide6Viz = () => {
    const [word, setWord] = React.useState("studies");
    
    const getStem = (w) => {
        const stems = { "studies": "studi", "running": "run", "flies": "fli", "better": "better" };
        return stems[w.toLowerCase()] || w;
    };
    
    const getLemma = (w) => {
        const lemmas = { "studies": "study", "running": "run", "flies": "fly", "better": "good" };
        return lemmas[w.toLowerCase()] || w;
    };

    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">
                    <span className="px-3 py-1 bg-orange-700 text-white text-xs font-bold rounded-full">COMPARISON</span>
                    <span className="text-4xl">🌱</span>
                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-orange-700 to-amber-600 bg-clip-text text-transparent">Stemming vs. Lemmatization</h1>
                <h2 className="text-xl text-slate-400 mb-6">Reducing Words to Their Roots</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                        <p className="text-slate-300"><strong>Stemming</strong> is a crude "chopping" algorithm. <strong>Lemmatization</strong> is a sophisticated dictionary lookup for the base form.</p>
                        <div className="flex gap-2 mb-4">
                            {["studies", "running", "flies", "better"].map(w => (
                                <button 
                                    key={w} 
                                    onClick={() => setWord(w)}
                                    className={`px-3 py-1 rounded text-sm font-mono border ${word === w ? 'bg-amber-600 border-amber-400 text-white' : 'bg-slate-800 border-slate-700 text-slate-400'}`}
                                >
                                    {w}
                                </button>
                            ))}
                        </div>
                        <div className="bg-black/40 p-4 rounded-lg border border-slate-700 font-mono text-sm text-amber-300">
                            <p>stemmer.stem(<span className="text-white">"{word}"</span>) <span className="text-slate-500"># {getStem(word)}</span></p>
                            <p>lemmatizer.lemmatize(<span className="text-white">"{word}"</span>) <span className="text-slate-500"># {getLemma(word)}</span></p>
                        </div>
                    </div>

                    <div className="bg-slate-900/60 border border-slate-700 rounded-2xl p-6 flex flex-col justify-around min-h-[300px]">
                        <div className="flex items-center gap-6">
                            <div className="w-12 h-12 bg-red-900/20 rounded-full flex items-center justify-center text-2xl border border-red-800">🔪</div>

const Slide8Viz = () => {
    const [text, setText] = React.useState("NLTK is great for NLP. NLP is a part of AI. AI is the future of NLTK.");
    
    const getFreq = () => {
        const words = text.toLowerCase().match(/\w+/g) || [];
        const stops = ['is', 'the', 'for', 'a', 'of'];
        const freq = {};
        words.filter(w => !stops.includes(w)).forEach(w => freq[w] = (freq[w] || 0) + 1);
        return Object.entries(freq).sort((a, b) => b[1] - a[1]).slice(0, 5);
    };

    const freqData = getFreq();
    const maxFreq = Math.max(...freqData.map(d => d[1]), 1);

    return (
        <div className="flex flex-col h-full justify-center items-center gap-5 p-6 animate-fade-in-up bg-slate-950">
            <div className="w-full max-w-4xl">
                <div className="flex justify-between items-center mb-4">

                </div>
                <h1 className="text-4xl font-bold text-white mb-2 bg-gradient-to-r from-teal-700 to-cyan-600 bg-clip-text text-transparent">Frequency Analysis</h1>
                <h2 className="text-xl text-slate-400 mb-6">What is the Text Actually About?</h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div className="space-y-4">
                        <p className="text-slate-300"><code>FreqDist</code> counts word occurrences. The most frequent non-stopwords usually define the subject of the text.</p>
                        <textarea 
                            value={text}
                            onChange={(e) => setText(e.target.value)}
                            className="w-full h-32 bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm text-cyan-300 focus:border-cyan-500 outline-none transition-colors"
                            placeholder="Type something here..."
                        />
                    </div>

                    <div className="bg-slate-900/60 border border-slate-700 rounded-2xl p-6 flex flex-col justify-end min-h-[250px]">
                        <div className="flex items-end justify-around h-40 gap-2">
                            {freqData.map(([word, count], i) => (
                                <div key={word} className="flex flex-col items-center flex-1 group">
                                    <div className="text-[10px] text-cyan-400 mb-1 font-bold">{count}</div>
                                    <div 
                                        className="w-full bg-gradient-to-t from-cyan-600 to-teal-400 rounded-t transition-all duration-500"
                                        style={{ height: `${(count / maxFreq) * 100}%` }}
                                    ></div>

                    </div>
                </div>
                <div className="font-mono text-sm font-bold text-white bg-black/20 px-5 py-2 rounded-full backdrop-blur border border-white/10 shadow-inner">Module {slide+1} of {total}</div>
            </header>
            <div className="flex-1 flex items-center justify-center p-8 z-10 w-full overflow-hidden">
                <div className="flex flex-col lg:flex-row gap-12 w-full max-w-[1600px] h-[80vh]">
                    <div className="flex flex-col justify-center h-full w-full lg:w-[45%] lg:pr-8" key={`t-${slide}`}>
                        <div className="animate-fade-in-up">
                            <span className="text-[10px] font-mono font-bold uppercase tracking-widest px-3 py-1.5 rounded border text-white shadow-sm bg-slate-800/80 border-slate-600 mb-6 inline-block">{s.badge}</span>
                            <h2 className="text-5xl font-extrabold text-white mb-4 tracking-tight leading-tight">{s.title}</h2>
                            <h3 className="text-2xl text-slate-400 font-light mb-8">{s.subtitle}</h3>
                        </div>
                        <div className="h-1 w-24 bg-gradient-to-r from-white to-transparent rounded mb-8 opacity-20"></div>
                        <div className="text-slate-300 leading-relaxed overflow-y-auto max-h-[38vh] pr-4 custom-scroll pb-4 animate-fade-in-up" style={{animationDelay:'.1s'}}>{s.body}</div>
                        <div className="flex gap-4 mt-auto pt-6 animate-fade-in-up" style={{animationDelay:'.2s'}}>
                            <button onClick={prev} disabled={slide===0} className="flex-1 py-4 border border-slate-700 hover:border-slate-500 hover:bg-slate-800 text-slate-300 rounded-xl text-sm font-bold disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-all uppercase tracking-wider cursor-pointer">← Previous</button>
                            <button onClick={next} disabled={slide===total-1} className={`flex-1 py-4 bg-gradient-to-r ${s.hue} hover:brightness-110 text-white rounded-xl text-sm font-bold disabled:opacity-30 disabled:cursor-not-allowed transition-all uppercase tracking-wider shadow-lg cursor-pointer`}>Next →</button>
                        </div>
                    </div>
                    <div className="h-full w-full lg:w-[55%] bg-slate-900/60 rounded-3xl border border-slate-700/80 backdrop-blur shadow-2xl overflow-hidden relative" key={`v-${slide}`}>
                        <div className="absolute inset-0 bg-gradient-to-br from-white/5 to-transparent pointer-events-none z-0"></div>
                        {s.viz}
                    </div>
                </div>
            </div>
            <div className="flex justify-center items-center gap-2 py-3 flex-shrink-0">
                {slides.map((_,i) => (
                    <button key={i} onClick={()=>setSlide(i)} className={`rounded-full transition-all duration-300 cursor-pointer ${i===slide?'w-6 h-2 bg-white':'w-2 h-2 bg-white/30 hover:bg-white/60'}`}/>
                ))}
            </div>
        </div>
    );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
